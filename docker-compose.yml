services:
    postgres:
        image: postgres:18
        container_name: local-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: myapp
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql #stored data

volumes:
    postgres_data: #defining volume name
